<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ff7a1a">
    <meta name="description" content="Thank you for shopping with SpeedCubingStore!">

    <title>Order Complete | SpeedCubingStore</title>
    <link rel="stylesheet" href="boughtscreen.css">
</head>

<body>
    <main class="thank-you-container">
        <section class="thank-you-content" aria-labelledby="thank-you-title">

            <div class="success-icon" aria-hidden="true">
                ✓
            </div>

            <h1 id="thank-you-title">
                Thank You for Your Purchase!
            </h1>

            <p class="thank-you-message">
                Your support means a lot to us. We hope you enjoy
                your new cube and have fun speedcubing!
            </p>

            <p class="team-message">
                With appreciation,<br>
                <strong>The SpeedCubingStore Team</strong>
            </p>

            <button
                class="cool-button"
                type="button"
                onclick="continueShopping()"
            >
                Continue Shopping →
            </button>

        </section>
    </main>

    <script>
        function continueShopping() {
            window.location.href = "Speedcubingstore.html";
        }
    </script>
</body>
</html>
